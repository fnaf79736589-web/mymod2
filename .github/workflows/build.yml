name: Build mods
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Build all mods
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "ПОМИЛКА: у сховищі немає zip"; exit 1; fi
          mkdir -p out
          for z in "${zips[@]}"; do
            echo "=== Збірка: $z ==="
            dir="work_$(basename "$z" .zip | tr ' ()' '___')"
            mkdir "$dir"
            unzip -q "$z" -d "$dir"
            f=$(find "$dir" -name build.gradle | head -1)
            if [ -z "$f" ]; then echo "ПОМИЛКА: build.gradle не знайдено у $z"; exit 1; fi
            (cd "$(dirname "$f")" && gradle build --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/out/$dir.log")
            cp "$(dirname "$f")"/build/libs/*.jar out/
          done
          ls -la out
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: out/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: out/*.jar
